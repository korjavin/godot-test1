name: 🛰️ Lobby service

# The multiplayer lobby in server/ is an independent Go service — it shares this
# repository with the Godot game and nothing else, so it gets its own workflow
# gated on server/** and never touches the GitHub Pages deploy in build.yml.
on:
  push:
    branches: [ master ]
    paths: [ 'server/**', '.github/workflows/lobby.yml' ]
  pull_request:
    branches: [ master ]
    paths: [ 'server/**', '.github/workflows/lobby.yml' ]
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Build and test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: server/go.sum

      - name: 🔎 Vet
        working-directory: server
        run: go vet ./...

      - name: 📐 Check formatting
        working-directory: server
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: 🧪 Test
        working-directory: server
        run: go test -race ./...

      # Build-only, so a broken Dockerfile fails the PR rather than the deploy.
      - name: 🐳 Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false

  # Only master publishes. A PR gets the test job and nothing else.
  deploy:
    name: 🚀 Publish image and redeploy
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # Job-level env, so the "is the webhook configured?" test below reads an
    # ordinary variable rather than the secrets context.
    env:
      PORTAINER_HOOK: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and push image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/godot-test1-lobby:${{ github.sha }}

      # Portainer watches the `deploy` branch, which carries the compose file
      # pinned to this commit's image. Never :latest in production.
      - name: 🌿 Pin the image on the deploy branch
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout -B deploy
          sed -i "s|\${LOBBY_IMAGE:-ghcr.io/${REPO_OWNER}/godot-test1-lobby:[^}]*}|\${LOBBY_IMAGE:-ghcr.io/${REPO_OWNER}/godot-test1-lobby:${COMMIT_SHA}}|g" server/docker-compose.yml
          git add server/docker-compose.yml
          git commit -m "ci: pin lobby image to ${COMMIT_SHA}" || echo "nothing to commit"
          git push origin deploy --force

      # Optional: only fires once the owner adds the stack's webhook as a secret.
      - name: 🪝 Trigger Portainer redeploy
        if: env.PORTAINER_HOOK != ''
        uses: distributhor/workflow-webhook@2381f0e9c7b6bf061fb1405bd0804b8706116369 # v3.0.8
        with:
          webhook_url: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
          webhook_secret: "trigger"
