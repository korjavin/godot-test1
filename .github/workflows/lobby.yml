name: 🛰️ Lobby service

# The multiplayer lobby in server/ is an independent Go service — it shares this
# repository with the Godot game and nothing else, so it gets its own workflow
# gated on server/** and never touches the GitHub Pages deploy in build.yml.
#
# This workflow TESTS only. Publishing the lobby image and pinning it on the
# `deploy` branch live in build.yml's deploy-stack job, which is the single writer
# of that force-pushed branch — see the comment there. The tradeoff is that the
# lobby image rebuilds on every master push instead of only on server/** changes.
#
# `workflow_call` exists so build.yml can gate that deploy on THESE checks: a job
# cannot depend on a job in another workflow, and the two run concurrently, so
# without it a master push could publish a lobby that fails `go test`. Calling the
# job rather than copying its steps keeps one definition — a check added here
# gates the deploy automatically instead of silently not gating it.
on:
  push:
    branches: [ master ]
    paths: [ 'server/**', '.github/workflows/lobby.yml' ]
  pull_request:
    branches: [ master ]
    paths: [ 'server/**', '.github/workflows/lobby.yml' ]
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Build and test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: server/go.sum

      - name: 🔎 Vet
        working-directory: server
        run: go vet ./...

      - name: 📐 Check formatting
        working-directory: server
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: 🧪 Test
        working-directory: server
        run: go test -race ./...

      # Build-only, so a broken Dockerfile fails the PR rather than the deploy.
      # The pushing build of this same context lives in build.yml's deploy-stack job.
      - name: 🐳 Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
