name: 🎮 Build and Deploy Web Game

# When to run this workflow
on:
  push:
    branches: [ master, claude/* ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment — but the group MUST be keyed by ref.
# An unkeyed `pages` group is repo-wide, so two parallel PR branches landed in
# the same group and cancelled each other's Build Web Export mid-docker-pull,
# which reads as a build failure (it bit one PR three times in one evening).
#
# Keying by ref preserves the master-deploy serialization exactly: every run
# that can deploy is a push to `refs/heads/master` (the `deploy` and
# `deploy-stack` jobs both gate on that), so all of them still share the single
# `pages-refs/heads/master` group and still supersede each other. A PR run
# (`refs/pull/N/merge`) or a `claude/*` branch push now only supersedes stale
# runs of its own ref, and can never touch master's.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5

jobs:
  # ============================================================================
  # Build Web Export
  # ============================================================================
  build:
    name: 🔨 Build Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 📦 Cache Godot imports
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/shader_cache
          key: godot-imports-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.gd', '**/*.csv', 'project.godot') }}
          restore-keys: |
            godot-imports-

      - name: 🔧 Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # Import BEFORE exporting, explicitly. A fresh clone has no .godot cache, and
      # `assets/translations/ui.csv` only becomes the `ui.en.translation` /
      # `ui.de.translation` resources that `project.godot`'s
      # `locale/translations` names once the CSV importer has run. Both generated
      # files are gitignored (`*.translation`, `*.import`), so this step is what
      # produces them in CI — and its failure mode is the reason it is not left to
      # the export's own implicit import: a missing translation resource does not
      # fail an export, it ships a build that is silently English in every locale.
      # Same command CLAUDE.md tells a human to run in a fresh clone.
      - name: 🌍 Import assets (generates the translation resources)
        run: |
          godot --headless --path . --import
          for locale in en de; do
            test -f "assets/translations/ui.${locale}.translation" \
              || { echo "::error::assets/translations/ui.${locale}.translation was not generated — the en/de UI would ship untranslated"; exit 1; }
          done

      # BEFORE the export, and that ordering is the whole feature. `BUILD_SHA` has
      # to travel INSIDE the pack, because a client must never learn its own
      # version by fetching it — a player served a stale shell would fetch the
      # current marker, agree with it, and never reload. Baked-in versus fetched
      # is the entire mechanism (see `scripts/build_version.gd`'s header).
      #
      # `sed` anchored on the start of the line, then a grep to prove it landed:
      # a silently no-op rewrite would ship a build that thinks it is "dev" and
      # never reloads anybody, which looks exactly like a working build.
      #
      # The grep is on the SOURCE, deliberately, and it is the only proof
      # available: a `.pck` stores its own directory and every exported GDScript
      # compressed (format v3 writes them through `FileAccessCompressed`), so the
      # SHA is not findable in the export by any grep or encoding. Don't add a
      # post-export check here expecting one — it can only ever fail.
      - name: 🔖 Bake the commit SHA into the export pack
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          sed -i "s|^const BUILD_SHA: String = \".*\"$|const BUILD_SHA: String = \"${COMMIT_SHA}\"|" scripts/build_version.gd
          grep -qx "const BUILD_SHA: String = \"${COMMIT_SHA}\"" scripts/build_version.gd \
            || { echo "::error::failed to bake BUILD_SHA into scripts/build_version.gd — the export would ship the 'dev' placeholder and no player would ever be pulled onto a new build"; exit 1; }

      - name: 🔨 Build for Web
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html

      # AFTER the export, into the same `build/web` both deploy targets are cut
      # from — so the Pages artifact and the nginx image each carry a marker naming
      # the build they were cut from. This is the "what the server currently
      # offers" half; the baked const above is the "what this tab is running" half,
      # and the client compares the two.
      - name: 🔖 Publish the version marker beside the export
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: printf '{"sha":"%s"}\n' "${COMMIT_SHA}" > build/web/version.json

      # `progressive_web_app/enabled=false` stops NEW exports shipping Godot's
      # cache-first service worker, but it cannot reach a worker already
      # registered in a player's browser — that registration is only ever
      # replaced by a byte-different script at the SAME url. So `web/` carries a
      # tombstone worker (read its header) and it is copied in here, into the
      # one directory both deploy targets are cut from: this is the Pages
      # artifact AND the `web-build` artifact that `deploy-stack` downloads as
      # web/site for the nginx image. One copy, both origins.
      #
      # The `cp` overwrites rather than merely adds, so re-enabling the PWA
      # setting by accident cannot quietly put the caching worker back.
      - name: 🪦 Install the service-worker tombstone
        run: |
          cp -v web/index.service.worker.js build/web/index.service.worker.js
          grep -q "registration.unregister()" build/web/index.service.worker.js \
            || { echo "::error::build/web/index.service.worker.js is not the tombstone — a caching worker would ship and updates would stop reaching players"; exit 1; }

      - name: 📤 Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        with:
          path: build/web

      - name: 📦 Upload web build as artifact (for download)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  # ============================================================================
  # Self-checks — the project's ONLY correctness gate
  #
  # This game has no test suite and no linter. What it has is the headless
  # self-checks in scripts/*_selfcheck.gd, each of which prints "SELFCHECK OK"
  # and exits 0. Until this job existed they were run by hand and reported in a
  # PR description, so "CI green" only ever meant "the web export builds" — a
  # change breaking determinism, the biome CPU/GPU parity contract, the speed
  # lattice or German fit merged green.
  #
  # SEPARATE JOBS, not steps in `build`, deliberately: they run in parallel so
  # they add no wall-clock, and a failing check reports as its own red check
  # rather than hiding behind a build failure. Both deploy jobs `needs:` the
  # `selfchecks` aggregator below, so nothing publishes on a red self-check.
  #
  # The suite is DISCOVERED BY GLOB, never listed here. A list in a workflow file
  # is a list nobody updates — five of these checks were added in a single day.
  # Globbing means a new scripts/*_selfcheck.gd is gated the moment it lands.
  #
  # SHARDED, because sequentially the suite took ~8 minutes and it is the gate
  # every push waits on. The partition is computed FROM THE GLOB AT RUNTIME by
  # `scripts/selfcheck_shards.sh` — never from a list of check names in this
  # file, for exactly the reason above: a list would go stale silently the first
  # time somebody adds a check, which is the failure mode this repo keeps
  # hitting. Nothing here knows how many shards there are either:
  # `strategy.job-index` / `strategy.job-total` are GitHub's own count of the
  # matrix, so the matrix list is the only edit a re-shard needs.
  #
  # It used to be "every Nth file", which is POSITIONAL and therefore reshuffles
  # whenever a file is added or renamed: PR #233 split two checks in two and
  # landed boss (3m01) and tower_interior (1m30) in one bin, taking the gate from
  # 4m30 to 6m00 while the other four shards sat idle at ~1m20. The script packs
  # by measured cost instead (weights in `scripts/selfcheck_durations.json`, an
  # unmeasured name treated as the heaviest); read its header for the packing and
  # for how to refresh the table. The glob is still the only source of truth for
  # WHAT runs — the table only says how heavy each name is.
  #
  # The fixed setup (checkout, fonts, import) repeats per shard by design — the
  # partition is dynamic, so any shard could draw locale_selfcheck or
  # intro_selfcheck and each shard has to be able to run every check.
  # ============================================================================
  selfcheck-shard:
    name: 🩺 Self-checks ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # A shard is a couple of minutes of actual work; this is only here so a check
    # whose SceneTree never calls quit() is a red build rather than a job the
    # runner kills six hours later.
    timeout-minutes: 15
    strategy:
      # NOT fail-fast, and it is the matrix half of the same rule the loop below
      # keeps: every check runs, every failure is named, and the verdict comes at
      # the end. A red shard must not cancel its siblings.
      fail-fast: false
      matrix:
        # The COUNT is what matters, not the values — the step reads
        # `strategy.job-index` / `strategy.job-total`, so this list is the one
        # place a re-shard is edited and no other number has to agree with it.
        shard: [ 1, 2, 3, 4, 5 ]
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      # locale_selfcheck MEASURES text — it renders every German string in the
      # real font at the real size and compares against the control's real pixel
      # budget. The godot-ci image ships neither fontconfig nor a single font
      # file, so Godot logs "libfontconfig.so.1: cannot open shared object file"
      # and any glyph outside its embedded font (the ⚙ on the tune button,
      # U+2699) falls back to something else entirely — measured that way the gear
      # button came out 103 px against its 98 px budget, a failure that reproduces
      # on no developer machine. A text-metric check in a font-less container is
      # measuring a fiction, so give the container the fonts a real machine has.
      # EVERY shard installs them: the partition is dynamic, so any shard can draw
      # locale_selfcheck.
      # RETRIED, with its own clock (bead godot-test1-i3e). On 2026-09-05 a
      # mid-sync Ubuntu mirror ("File has unexpected size", "Hash Sum mismatch",
      # apt exit 100) or a hung fetch killed shard after shard across a dozen
      # PRs and master itself BEFORE a single self-check ran — every one a
      # manual `gh run rerun --failed`. Three attempts twenty seconds apart
      # ride out a sync; the step's own 4-minute cap turns a hung mirror into a
      # retry instead of eating the job's 15 minutes. `apt-get update` is
      # inside the loop on purpose: the index is what the mirror was mid-way
      # through rewriting. Each ATTEMPT has its own `timeout(1)` and apt's own
      # socket timeouts, because the first cut of this loop had only the step
      # cap and a mirror that accepted the connection and then sent nothing hung
      # attempt 1 for the whole four minutes — the retry never fired.
      - name: 🔤 Install fonts (locale_selfcheck measures real glyph widths)
        timeout-minutes: 6
        run: |
          APT="apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=2"
          # The runners live in Azure; archive.ubuntu.com refused every
          # connection for an hour on 2026-09-05 while Azure's own mirror of it
          # answered. Attempts 1-2 go to the Azure mirror, attempt 3 to the
          # original, so a dead mirror on either side still gets the fonts.
          mirror_azure() { sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g; s|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true; }
          mirror_back()  { sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true; }
          mirror_azure
          for attempt in 1 2 3; do
            [ "$attempt" = 3 ] && mirror_back
            if timeout 75 $APT update \
               && timeout 90 $APT install -y --no-install-recommends libfontconfig1 fonts-dejavu-core; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed (mirror mid-sync?), retrying in 20 s"
            sleep 20
          done
          echo "::error::apt failed three times — the Ubuntu mirror, not this branch"
          exit 1

      # NOT optional, and not merely a speed-up. A cold checkout has no .godot
      # cache and both `*.import` and `*.translation` are gitignored, so without
      # this: locale_selfcheck measures a stale/absent translation table, and a
      # global `class_name` (IntroVideo) resolves to nothing at all, which makes
      # intro_selfcheck fail to PARSE — see the exit-code note in the run step
      # for why that would otherwise have been silently green.
      # Same command CLAUDE.md tells a human to run in a fresh clone. Per shard,
      # for the same reason the fonts are.
      - name: 🌍 Import assets (generates the translation resources)
        run: |
          godot --headless --path . --import
          for locale in en de; do
            test -f "assets/translations/ui.${locale}.translation" \
              || { echo "::error::assets/translations/ui.${locale}.translation was not generated — locale_selfcheck would measure a table that is not there"; exit 1; }
          done

      # THE EXIT CODE ALONE IS NOT A VERDICT, and it misses TWO different things.
      # Measured on 4.5: a script that fails to PARSE prints "Failed to load
      # script ... Parse error" and `godot --headless --script` still exits 0 —
      # the check never ran and the job would go green. A RUNTIME error is the
      # same hole one step later: Godot logs "SCRIPT ERROR:", aborts that call,
      # carries on, and the script still reaches its final print and exits 0 —
      # which is how budapest_selfcheck once printed SELFCHECK OK while every
      # assertion in its check 4 had been skipped (bead godot-test1-egr).
      # So a pass needs all THREE: exit 0, the literal "SELFCHECK OK" line the
      # script only prints after its last assertion, and NO "SCRIPT ERROR" in the
      # captured output. Together they also catch a crash, a missing binary and
      # an empty glob.
      #
      # NOT fail-fast: every check in this shard runs, every failure is named,
      # and the verdict comes at the end. One broken check must not hide the
      # state of the others — the whole point of running them is knowing which
      # contracts hold. (The matrix carries the same rule; see `fail-fast` above.)
      #
      # THE PARTITION is `scripts/selfcheck_shards.sh`, which is a pure function
      # of the glob plus a committed weights table, so a check added to scripts/
      # is covered the day it lands with no edit here. The shards must agree on
      # its answer — they do, being the same image on the same checkout — and if
      # they ever did not, the aggregator's union check below is what catches it
      # rather than a check silently running twice or never.
      #
      # PLAIN POSIX sh, deliberately — no arrays, no `shopt`, no `<<<`. The
      # godot-ci image ships no bash, so Actions falls back to `sh -e {0}` and a
      # bashism is an exit 127 before the first check runs (it was, once). Every
      # other step in this workflow is POSIX for the same reason. A hung check is
      # caught by the job's `timeout-minutes`, not a per-check `timeout(1)` —
      # one less binary to assume the image has.
      - name: 🩺 Run this shard's self-checks
        env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          command -v godot >/dev/null || { echo "::error::godot is not on PATH — no self-check would have run"; exit 1; }
          : > "ran-${SHARD}.txt"
          total=$(sh scripts/selfcheck_shards.sh --count)
          ran=0
          failed=""
          for check in $(sh scripts/selfcheck_shards.sh "$SHARD" "$SHARDS"); do
            ran=$((ran + 1))
            name=$(basename "$check" .gd)
            echo "$name" >> "ran-${SHARD}.txt"
            echo "::group::${name}"
            began=$(date +%s)
            if out=$(godot --headless --path . --script "res://${check}" 2>&1); then rc=0; else rc=$?; fi
            printf '%s\n' "$out"
            echo "::endgroup::"
            why=""
            [ "$rc" -eq 0 ] || why="exited ${rc}"
            printf '%s\n' "$out" | grep -qx "SELFCHECK OK" || why="${why}${why:+; }no 'SELFCHECK OK' line"
            if printf '%s\n' "$out" | grep -q "SCRIPT ERROR"; then
              why="${why}${why:+; }logged SCRIPT ERROR — a runtime error aborts that call and skips every assertion after it, and Godot still exits 0"
            fi
            if [ -z "$why" ]; then
              # The seconds are how selfcheck_durations.json gets refreshed —
              # see the script's header. Nothing reads them automatically.
              echo "OK   ${name}  ($(( $(date +%s) - began ))s)"
            else
              echo "::error::${name} FAILED — ${why} (see the ${name} log group above)"
              failed="${failed} ${name}"
            fi
          done
          echo "-- shard ${SHARD}: ran ${ran} of the glob's ${total} self-checks --"
          # A command substitution in a `for` list is NOT checked by `set -e`, so
          # a partition script that died would silently run nothing and pass.
          # (True only while there are more checks than shards, which there are
          # by a factor of eight.)
          [ "$ran" -gt 0 ] || { echo "::error::this shard ran no self-checks at all"; exit 1; }
          [ -z "$failed" ] || { echo "::error::self-checks failed:${failed}"; exit 1; }
          echo "shard ${SHARD}: all ${ran} self-checks passed"

      # `always()`, so a red shard still reports WHICH checks it ran — otherwise a
      # single failure would also make the aggregator's union check red for a
      # second, misleading reason.
      - name: 📤 Report which checks this shard ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfcheck-ran-${{ strategy.job-index }}
          path: ran-${{ strategy.job-index }}.txt
          retention-days: 1

  # ============================================================================
  # THE GATE ITSELF. `deploy` and `deploy-stack` `needs:` this job, and it is
  # green only when EVERY shard is green: `needs.selfcheck-shard.result` is the
  # matrix's AGGREGATE result, so one red shard makes it 'failure' and this job
  # fails. `if: always()` is what makes that reachable — without it a failed
  # matrix would SKIP this job, and a skipped `needs:` blocks the deploy too, but
  # silently and with no verdict printed. Do not drop the explicit result test:
  # `always()` alone would make this job green regardless.
  #
  # It also re-does the arithmetic the shards did: the union of what they ran
  # must be exactly the glob, with no name run twice and none missed. That is the
  # measurement behind "every check still runs on every push" — the shards report
  # what they ACTUALLY executed, and this compares it against the glob rather
  # than trusting the partition.
  # ============================================================================
  selfchecks:
    name: 🩺 Self-checks
    needs: selfcheck-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🧮 Every shard must be green
        env:
          SHARD_RESULT: ${{ needs.selfcheck-shard.result }}
        run: |
          echo "shard matrix result: ${SHARD_RESULT}"
          [ "${SHARD_RESULT}" = "success" ] \
            || { echo "::error::a self-check shard did not pass (${SHARD_RESULT}) — see the shard jobs for the named failures"; exit 1; }

      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Collect what every shard ran
        uses: actions/download-artifact@v4
        with:
          pattern: selfcheck-ran-*
          path: ran
          merge-multiple: true

      # The partition script's own check, and the only place it CAN run: it
      # simulates the packing over the real glob plus a dummy file, which no
      # live shard can do, and it fails a weights entry naming a check that no
      # longer exists. Needs no godot and no import — a second of shell.
      - name: 🧮 The partition script agrees with itself
        run: sh scripts/selfcheck_shards.sh --selftest

      - name: 🧮 The union of the shards must be exactly the glob
        run: |
          cat ran/ran-*.txt | sort > /tmp/ran.txt
          for check in scripts/*_selfcheck.gd; do
            [ -e "$check" ] || { echo "::error::scripts/*_selfcheck.gd matched nothing — the suite would have silently passed"; exit 1; }
            basename "$check" .gd
          done | sort > /tmp/glob.txt
          echo "-- $(wc -l < /tmp/ran.txt) self-checks executed across the shards; the glob names $(wc -l < /tmp/glob.txt) --"
          dupes=$(uniq -d /tmp/ran.txt)
          [ -z "$dupes" ] || { printf '%s\n' "$dupes"; echo "::error::the shards overlap — the checks above ran more than once, so the partition is not a partition"; exit 1; }
          diff -u /tmp/glob.txt /tmp/ran.txt \
            || { echo "::error::the shards did not run exactly the glob (- = in the glob but never run, + = run but not in the glob)"; exit 1; }
          echo "every self-check in scripts/*_selfcheck.gd ran exactly once"

  # ============================================================================
  # Enemy-model contract
  #
  # scripts/predator_parts.py is the toolkit every biome-predator generator is
  # built on, and it asserts that toolkit's contract (orientation, feet at y=0,
  # one vertex-coloured mesh) on every build. Running it rebuilds all ten models
  # plus the wing and neck primitives and prints the same "SELFCHECK OK". Nothing
  # else checks any of that — the .glb files are committed, so a toolkit change
  # that breaks a model is invisible until someone regenerates by hand.
  #
  # And because it rebuilds before it asserts, it can only ever judge the CODE.
  # The second step is what judges the ARTIFACT — read its comment; the two
  # together are the gate, and neither half catches what the other does.
  #
  # Its own job on a plain runner rather than a step in `selfchecks`: it needs
  # python3 + trimesh + numpy, which the godot-ci container does not carry, and
  # a pip install there would be a second toolchain bolted into an image we do
  # not own. The rebuilt .glb files are thrown away with the runner — this job
  # verifies, it does not publish.
  # ============================================================================
  model-selfcheck:
    name: 🐺 Enemy-model self-check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PINNED, in scripts/requirements.txt — read its header. The staleness gate
      # below compares float arrays byte-for-byte, so an unpinned install would
      # make it red on somebody else's release day rather than on a real defect.
      - name: 📦 Install the generator's dependencies
        run: pip install -r scripts/requirements.txt

      # Same two-part verdict as the GDScript suite, for the same reason: a
      # generator that printed nothing and exited 0 would be indistinguishable
      # from a pass.
      - name: 🐺 Rebuild and verify every predator model
        run: |
          out=$(python3 scripts/predator_parts.py 2>&1) && printf '%s\n' "$out" | grep -qx "SELFCHECK OK" || {
            printf '%s\n' "$out"
            echo "::error::scripts/predator_parts.py did not print SELFCHECK OK — the enemy-model contract is broken"
            exit 1
          }
          printf '%s\n' "$out"

      # THE FOUR HEROES, and they are a SEPARATE step on purpose. They share the
      # predators' `export_faceted` seam (bead godot-test1-y1o.21) and so share
      # the staleness gate below — the dirty check already globs the whole of
      # assets/models/characters, `*_parts/` included, so it needed no edit — but
      # they owe none of the toolkit's three contracts and print no SELFCHECK OK,
      # so there is no two-part verdict to ask for here: a generator that fails
      # exits non-zero, and one that silently builds the wrong thing is caught by
      # the dirty check. Folding them into predator_parts.py's loop instead would
      # have made `python3 scripts/predator_parts.py` — the documented way to
      # rebuild the PREDATORS — hard-fail for anyone without shapely.
      - name: 🦸 Rebuild every hero model
        run: |
          for hero in windman primm teibi phoboman; do
            python3 "scripts/generate_${hero}_separate.py" || {
              echo "::error::scripts/generate_${hero}_separate.py failed"
              exit 1
            }
          done

      # THE STEPS ABOVE GRADE THEIR OWN HOMEWORK. They rebuild every model and
      # then assert what they can on what they just built — never on the
      # bytes the repo ships. So a committed .glb that no generator produces
      # passes forever, which is exactly how the hydra shipped for a day with
      # 18 mm neck stubs and 80 mm holes at its elbows: the artifact had been
      # committed from a working tree the code never caught up with, and every
      # contract the toolkit asserts held on the rebuild.
      #
      # The rebuild writes in place, so the whole gate is "did that dirty the
      # tree?" — no comparison script, and it covers every model rather than the
      # one that broke. `--porcelain` catches an untracked file too, so a NEW
      # generator whose output was never committed is a failure and not a
      # silence.
      #
      # This is a byte comparison of float arrays and it is deliberate: with the
      # toolchain pinned (scripts/requirements.txt) the generators are
      # reproducible, and anything weaker — a rounded vertex hash — buys
      # tolerance for a drift that should not exist. If a toolchain bump ever
      # makes this genuinely unpinnable across platforms, the fallback is a
      # tolerance-based geometry compare, not deleting the gate.
      - name: 🔍 The committed models must match what the generators build
        run: |
          dirty=$(git status --porcelain -- assets/models/characters)
          [ -z "$dirty" ] || {
            printf '%s\n' "$dirty"
            git diff --stat -- assets/models/characters
            echo "::error::rebuilding dirtied the models listed above — the committed .glb is not what its generator produces. Run 'pip install -r scripts/requirements.txt && python3 scripts/predator_parts.py' (predators + crocodile) and 'python3 scripts/generate_<hero>_separate.py' (heroes) and commit the result."
            exit 1
          }
          echo "every committed model matches its generator"

  # ============================================================================
  # Publish the godot-mp stack (only from master branch)
  #
  # THIS JOB IS THE SINGLE OWNER OF THE `deploy` BRANCH. Portainer reads
  # server/docker-compose.yml from that branch, and the branch is maintained by a
  # force-push — so it can only have one writer. Two workflows force-pushing it
  # (which is what a separate lobby deploy job would be) would each reset the
  # branch to their own checkout and silently clobber the other's image pin.
  # That is why both images are built here, and why `.github/workflows/lobby.yml`
  # keeps only its test job. Both tags are pinned in the SAME commit, so the two
  # containers of a deploy always come from one master commit.
  #
  # The cost, accepted deliberately: the lobby image now rebuilds on every master
  # push rather than only on server/** changes. It is a small Go build.
  #
  # It publishes a lobby image, so it is gated on the lobby's own checks through
  # the reusable lobby-checks job below — `needs:` cannot reach into another
  # workflow, and lobby.yml runs concurrently, so a failing `go test` would
  # otherwise not stop the deploy.
  #
  # Same export, second home: GitHub Pages keeps serving the game, and the web
  # image puts it behind Traefik at https://${LOBBY_HOST}/ from the same stack as
  # the lobby, so the game and the lobby it talks to share one origin.
  # ============================================================================
  # The lobby's own checks, reused rather than re-typed — deploy-stack publishes a
  # lobby image, so it must not run before `go vet` / gofmt / `go test -race` pass.
  # lobby.yml is a separate workflow running concurrently, and `needs:` cannot
  # reach across workflows, so the deploy gate has to call it.
  lobby-checks:
    name: 🧪 Lobby checks
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    uses: ./.github/workflows/lobby.yml

  deploy-stack:
    name: 🚀 Publish images and redeploy stack
    # Self-checks gate the publish too: the images are production, and a build
    # that exports cleanly while a correctness contract is broken must not ship.
    needs: [ build, selfchecks, model-selfcheck, lobby-checks ]
    # Master pushes only — a PR must not build or push any image.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # force-pushes the deploy branch
      packages: write
    # Job-level env, so the "is the webhook configured?" test below reads an
    # ordinary variable rather than the secrets context (same as lobby.yml).
    env:
      PORTAINER_HOOK: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Lands beside web/Dockerfile as the ./site directory it COPYs — the
      # Dockerfile only copies the export, it does not build the game.
      - name: 📦 Download the web export
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/site

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA tags only, for both images — production is never :latest, so a
      # redeploy can never quietly pick up a different build than the one pinned.
      - name: 🐳 Build and push the lobby image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/godot-test1-lobby:${{ github.sha }}

      - name: 🐳 Build and push the web client image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/godot-test1-web:${{ github.sha }}

      # Both pins land in one commit, after both images exist in the registry.
      - name: 🌿 Pin both images on the deploy branch
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout -B deploy
          sed -i \
            -e "s|\${LOBBY_IMAGE:-ghcr.io/${REPO_OWNER}/godot-test1-lobby:[^}]*}|\${LOBBY_IMAGE:-ghcr.io/${REPO_OWNER}/godot-test1-lobby:${COMMIT_SHA}}|g" \
            -e "s|\${WEB_IMAGE:-ghcr.io/${REPO_OWNER}/godot-test1-web:[^}]*}|\${WEB_IMAGE:-ghcr.io/${REPO_OWNER}/godot-test1-web:${COMMIT_SHA}}|g" \
            server/docker-compose.yml
          # A silently no-op sed would deploy a stale image forever, so prove both
          # pins landed before the branch moves.
          for image in lobby web; do
            grep -q "godot-test1-${image}:${COMMIT_SHA}" server/docker-compose.yml \
              || { echo "::error::failed to pin godot-test1-${image} in server/docker-compose.yml"; exit 1; }
          done
          git add server/docker-compose.yml
          git commit -m "ci: pin lobby and web images to ${COMMIT_SHA}" || echo "nothing to commit"
          git push origin deploy --force

      # Skipped when the secret is absent, so the images still publish without it.
      - name: 🪝 Trigger Portainer redeploy
        if: env.PORTAINER_HOOK != ''
        uses: distributhor/workflow-webhook@2381f0e9c7b6bf061fb1405bd0804b8706116369 # v3.0.8
        with:
          webhook_url: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
          webhook_secret: "trigger"

  # ============================================================================
  # Deploy to GitHub Pages (only from master branch)
  # ============================================================================
  deploy:
    name: 🚀 Deploy to GitHub Pages
    # Same gate as deploy-stack: Pages is production too, so a build that
    # exports cleanly while a self-check is red must not reach players.
    needs: [ build, selfchecks, model-selfcheck ]
    runs-on: ubuntu-latest
    # Only deploy on push to master branch
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
