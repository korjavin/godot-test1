name: 🎮 Build and Deploy Web Game

# When to run this workflow
on:
  push:
    branches: [ master, claude/* ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment — but the group MUST be keyed by ref.
# An unkeyed `pages` group is repo-wide, so two parallel PR branches landed in
# the same group and cancelled each other's Build Web Export mid-docker-pull,
# which reads as a build failure (it bit one PR three times in one evening).
#
# Keying by ref preserves the master-deploy serialization exactly: every run
# that can deploy is a push to `refs/heads/master` (the `deploy` and
# `deploy-stack` jobs both gate on that), so all of them still share the single
# `pages-refs/heads/master` group and still supersede each other. A PR run
# (`refs/pull/N/merge`) or a `claude/*` branch push now only supersedes stale
# runs of its own ref, and can never touch master's.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5

jobs:
  # ============================================================================
  # Build Web Export
  # ============================================================================
  build:
    name: 🔨 Build Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 📦 Cache Godot imports
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/shader_cache
          key: godot-imports-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.gd', '**/*.csv', 'project.godot') }}
          restore-keys: |
            godot-imports-

      - name: 🔧 Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # Import BEFORE exporting, explicitly. A fresh clone has no .godot cache, and
      # `assets/translations/ui.csv` only becomes the `ui.en.translation` /
      # `ui.de.translation` resources that `project.godot`'s
      # `locale/translations` names once the CSV importer has run. Both generated
      # files are gitignored (`*.translation`, `*.import`), so this step is what
      # produces them in CI — and its failure mode is the reason it is not left to
      # the export's own implicit import: a missing translation resource does not
      # fail an export, it ships a build that is silently English in every locale.
      # Same command CLAUDE.md tells a human to run in a fresh clone.
      - name: 🌍 Import assets (generates the translation resources)
        run: |
          godot --headless --path . --import
          for locale in en de; do
            test -f "assets/translations/ui.${locale}.translation" \
              || { echo "::error::assets/translations/ui.${locale}.translation was not generated — the en/de UI would ship untranslated"; exit 1; }
          done

      # BEFORE the export, and that ordering is the whole feature. `BUILD_SHA` has
      # to travel INSIDE the pack, because a client must never learn its own
      # version by fetching it — a player served a stale shell would fetch the
      # current marker, agree with it, and never reload. Baked-in versus fetched
      # is the entire mechanism (see `scripts/build_version.gd`'s header).
      #
      # `sed` anchored on the start of the line, then a grep to prove it landed:
      # a silently no-op rewrite would ship a build that thinks it is "dev" and
      # never reloads anybody, which looks exactly like a working build.
      #
      # The grep is on the SOURCE, deliberately, and it is the only proof
      # available: a `.pck` stores its own directory and every exported GDScript
      # compressed (format v3 writes them through `FileAccessCompressed`), so the
      # SHA is not findable in the export by any grep or encoding. Don't add a
      # post-export check here expecting one — it can only ever fail.
      - name: 🔖 Bake the commit SHA into the export pack
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          sed -i "s|^const BUILD_SHA: String = \".*\"$|const BUILD_SHA: String = \"${COMMIT_SHA}\"|" scripts/build_version.gd
          grep -qx "const BUILD_SHA: String = \"${COMMIT_SHA}\"" scripts/build_version.gd \
            || { echo "::error::failed to bake BUILD_SHA into scripts/build_version.gd — the export would ship the 'dev' placeholder and no player would ever be pulled onto a new build"; exit 1; }

      - name: 🔨 Build for Web
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html

      # AFTER the export, into the same `build/web` both deploy targets are cut
      # from — so the Pages artifact and the nginx image each carry a marker naming
      # the build they were cut from. This is the "what the server currently
      # offers" half; the baked const above is the "what this tab is running" half,
      # and the client compares the two.
      - name: 🔖 Publish the version marker beside the export
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: printf '{"sha":"%s"}\n' "${COMMIT_SHA}" > build/web/version.json

      # `progressive_web_app/enabled=false` stops NEW exports shipping Godot's
      # cache-first service worker, but it cannot reach a worker already
      # registered in a player's browser — that registration is only ever
      # replaced by a byte-different script at the SAME url. So `web/` carries a
      # tombstone worker (read its header) and it is copied in here, into the
      # one directory both deploy targets are cut from: this is the Pages
      # artifact AND the `web-build` artifact that `deploy-stack` downloads as
      # web/site for the nginx image. One copy, both origins.
      #
      # The `cp` overwrites rather than merely adds, so re-enabling the PWA
      # setting by accident cannot quietly put the caching worker back.
      - name: 🪦 Install the service-worker tombstone
        run: |
          cp -v web/index.service.worker.js build/web/index.service.worker.js
          grep -q "registration.unregister()" build/web/index.service.worker.js \
            || { echo "::error::build/web/index.service.worker.js is not the tombstone — a caching worker would ship and updates would stop reaching players"; exit 1; }

      - name: 📤 Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        with:
          path: build/web

      - name: 📦 Upload web build as artifact (for download)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  # ============================================================================
  # Self-checks — the project's ONLY correctness gate
  #
  # This game has no test suite and no linter. What it has is the headless
  # self-checks in scripts/*_selfcheck.gd, each of which prints "SELFCHECK OK"
  # and exits 0. Until this job existed they were run by hand and reported in a
  # PR description, so "CI green" only ever meant "the web export builds" — a
  # change breaking determinism, the biome CPU/GPU parity contract, the speed
  # lattice or German fit merged green.
  #
  # A SEPARATE JOB, not a step in `build`, deliberately: it runs in parallel so
  # it adds no wall-clock, and a failing check reports as its own red check
  # rather than hiding behind a build failure. Both deploy jobs `needs:` it, so
  # nothing publishes on a red self-check.
  #
  # The suite is DISCOVERED BY GLOB, never listed here. A list in a workflow file
  # is a list nobody updates — five of these checks were added in a single day.
  # Globbing means a new scripts/*_selfcheck.gd is gated the moment it lands.
  # ============================================================================
  selfchecks:
    name: 🩺 Self-checks
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      # NOT optional, and not merely a speed-up. A cold checkout has no .godot
      # cache and both `*.import` and `*.translation` are gitignored, so without
      # this: locale_selfcheck measures a stale/absent translation table, and a
      # global `class_name` (IntroVideo) resolves to nothing at all, which makes
      # intro_selfcheck fail to PARSE — see the exit-code note in the run step
      # for why that would otherwise have been silently green.
      # Same command CLAUDE.md tells a human to run in a fresh clone.
      - name: 🌍 Import assets (generates the translation resources)
        run: |
          godot --headless --path . --import
          for locale in en de; do
            test -f "assets/translations/ui.${locale}.translation" \
              || { echo "::error::assets/translations/ui.${locale}.translation was not generated — locale_selfcheck would measure a table that is not there"; exit 1; }
          done

      # THE EXIT CODE ALONE IS NOT A VERDICT. Measured on 4.5: a script that
      # fails to parse prints "Failed to load script ... Parse error" and
      # `godot --headless --script` still exits 0 — the check never ran and the
      # job would go green. So a pass requires BOTH exit 0 AND the literal
      # "SELFCHECK OK" line the script only prints after its last assertion.
      # That is also what catches a crash, a missing binary and an empty glob.
      #
      # NOT fail-fast: every check runs, every failure is named, and the verdict
      # comes at the end. One broken check must not hide the state of the other
      # fifteen — the whole point of running them is knowing which contracts hold.
      - name: 🩺 Run every self-check
        run: |
          command -v godot >/dev/null || { echo "::error::godot is not on PATH — no self-check would have run"; exit 1; }
          shopt -s nullglob
          checks=(scripts/*_selfcheck.gd)
          [ ${#checks[@]} -gt 0 ] || { echo "::error::scripts/*_selfcheck.gd matched nothing — the suite would have silently passed"; exit 1; }
          failed=()
          for check in "${checks[@]}"; do
            name=$(basename "$check" .gd)
            echo "::group::${name}"
            # `timeout` so a check that hangs (a SceneTree that never quits) is a
            # red build in 5 minutes, not a 6-hour job the runner kills.
            if out=$(timeout 300 godot --headless --path . --script "res://${check}" 2>&1) \
              && grep -qx "SELFCHECK OK" <<<"$out"; then
              echo "$out"
              echo "::endgroup::"
              echo "✅ ${name}"
            else
              echo "$out"
              echo "::endgroup::"
              echo "::error::${name} FAILED — no 'SELFCHECK OK' (see the ${name} log group above)"
              failed+=("$name")
            fi
          done
          echo "── ${#checks[@]} self-checks run, ${#failed[@]} failed ──"
          [ ${#failed[@]} -eq 0 ] || { echo "::error::self-checks failed: ${failed[*]}"; exit 1; }

  # ============================================================================
  # Enemy-model contract
  #
  # scripts/predator_parts.py is the toolkit every biome-predator generator is
  # built on, and it asserts that toolkit's contract (orientation, feet at y=0,
  # one vertex-coloured mesh) on every build. Running it rebuilds all six models
  # plus the wing primitive and prints the same "SELFCHECK OK". Nothing else
  # checks any of that — the .glb files are committed, so a toolkit change that
  # breaks a model is invisible until someone regenerates by hand.
  #
  # Its own job on a plain runner rather than a step in `selfchecks`: it needs
  # python3 + trimesh + numpy, which the godot-ci container does not carry, and
  # a pip install there would be a second toolchain bolted into an image we do
  # not own. The rebuilt .glb files are thrown away with the runner — this job
  # verifies, it does not publish.
  # ============================================================================
  model-selfcheck:
    name: 🐺 Enemy-model self-check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install the generator's dependencies
        run: pip install trimesh numpy

      # Same two-part verdict as the GDScript suite, for the same reason: a
      # generator that printed nothing and exited 0 would be indistinguishable
      # from a pass.
      - name: 🐺 Rebuild and verify every predator model
        run: |
          out=$(python3 scripts/predator_parts.py 2>&1) && grep -qx "SELFCHECK OK" <<<"$out" || {
            echo "$out"
            echo "::error::scripts/predator_parts.py did not print SELFCHECK OK — the enemy-model contract is broken"
            exit 1
          }
          echo "$out"

  # ============================================================================
  # Publish the godot-mp stack (only from master branch)
  #
  # THIS JOB IS THE SINGLE OWNER OF THE `deploy` BRANCH. Portainer reads
  # server/docker-compose.yml from that branch, and the branch is maintained by a
  # force-push — so it can only have one writer. Two workflows force-pushing it
  # (which is what a separate lobby deploy job would be) would each reset the
  # branch to their own checkout and silently clobber the other's image pin.
  # That is why both images are built here, and why `.github/workflows/lobby.yml`
  # keeps only its test job. Both tags are pinned in the SAME commit, so the two
  # containers of a deploy always come from one master commit.
  #
  # The cost, accepted deliberately: the lobby image now rebuilds on every master
  # push rather than only on server/** changes. It is a small Go build.
  #
  # It publishes a lobby image, so it is gated on the lobby's own checks through
  # the reusable lobby-checks job below — `needs:` cannot reach into another
  # workflow, and lobby.yml runs concurrently, so a failing `go test` would
  # otherwise not stop the deploy.
  #
  # Same export, second home: GitHub Pages keeps serving the game, and the web
  # image puts it behind Traefik at https://${LOBBY_HOST}/ from the same stack as
  # the lobby, so the game and the lobby it talks to share one origin.
  # ============================================================================
  # The lobby's own checks, reused rather than re-typed — deploy-stack publishes a
  # lobby image, so it must not run before `go vet` / gofmt / `go test -race` pass.
  # lobby.yml is a separate workflow running concurrently, and `needs:` cannot
  # reach across workflows, so the deploy gate has to call it.
  lobby-checks:
    name: 🧪 Lobby checks
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    uses: ./.github/workflows/lobby.yml

  deploy-stack:
    name: 🚀 Publish images and redeploy stack
    # Self-checks gate the publish too: the images are production, and a build
    # that exports cleanly while a correctness contract is broken must not ship.
    needs: [ build, selfchecks, model-selfcheck, lobby-checks ]
    # Master pushes only — a PR must not build or push any image.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # force-pushes the deploy branch
      packages: write
    # Job-level env, so the "is the webhook configured?" test below reads an
    # ordinary variable rather than the secrets context (same as lobby.yml).
    env:
      PORTAINER_HOOK: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Lands beside web/Dockerfile as the ./site directory it COPYs — the
      # Dockerfile only copies the export, it does not build the game.
      - name: 📦 Download the web export
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/site

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA tags only, for both images — production is never :latest, so a
      # redeploy can never quietly pick up a different build than the one pinned.
      - name: 🐳 Build and push the lobby image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/godot-test1-lobby:${{ github.sha }}

      - name: 🐳 Build and push the web client image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/godot-test1-web:${{ github.sha }}

      # Both pins land in one commit, after both images exist in the registry.
      - name: 🌿 Pin both images on the deploy branch
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout -B deploy
          sed -i \
            -e "s|\${LOBBY_IMAGE:-ghcr.io/${REPO_OWNER}/godot-test1-lobby:[^}]*}|\${LOBBY_IMAGE:-ghcr.io/${REPO_OWNER}/godot-test1-lobby:${COMMIT_SHA}}|g" \
            -e "s|\${WEB_IMAGE:-ghcr.io/${REPO_OWNER}/godot-test1-web:[^}]*}|\${WEB_IMAGE:-ghcr.io/${REPO_OWNER}/godot-test1-web:${COMMIT_SHA}}|g" \
            server/docker-compose.yml
          # A silently no-op sed would deploy a stale image forever, so prove both
          # pins landed before the branch moves.
          for image in lobby web; do
            grep -q "godot-test1-${image}:${COMMIT_SHA}" server/docker-compose.yml \
              || { echo "::error::failed to pin godot-test1-${image} in server/docker-compose.yml"; exit 1; }
          done
          git add server/docker-compose.yml
          git commit -m "ci: pin lobby and web images to ${COMMIT_SHA}" || echo "nothing to commit"
          git push origin deploy --force

      # Skipped when the secret is absent, so the images still publish without it.
      - name: 🪝 Trigger Portainer redeploy
        if: env.PORTAINER_HOOK != ''
        uses: distributhor/workflow-webhook@2381f0e9c7b6bf061fb1405bd0804b8706116369 # v3.0.8
        with:
          webhook_url: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
          webhook_secret: "trigger"

  # ============================================================================
  # Deploy to GitHub Pages (only from master branch)
  # ============================================================================
  deploy:
    name: 🚀 Deploy to GitHub Pages
    # Same gate as deploy-stack: Pages is production too, so a build that
    # exports cleanly while a self-check is red must not reach players.
    needs: [ build, selfchecks, model-selfcheck ]
    runs-on: ubuntu-latest
    # Only deploy on push to master branch
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
