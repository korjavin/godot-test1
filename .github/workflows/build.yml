name: 🎮 Build and Deploy Web Game

# When to run this workflow
on:
  push:
    branches: [ master, claude/* ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5
  EXPORT_NAME: zelda-like-game

jobs:
  # ============================================================================
  # Build Web Export
  # ============================================================================
  build:
    name: 🔨 Build Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 📦 Cache Godot imports
        uses: actions/cache@v3
        with:
          path: |
            .godot/imported
            .godot/shader_cache
          key: godot-imports-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.gd', 'project.godot') }}
          restore-keys: |
            godot-imports-

      - name: 🔧 Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: 🔨 Build for Web
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html

      - name: 📤 Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        with:
          path: build/web

      - name: 📦 Upload web build as artifact (for download)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  # ============================================================================
  # Publish the web client image (only from master branch)
  #
  # Same export, second home: GitHub Pages keeps serving it, and this image puts
  # it behind Traefik at https://${LOBBY_HOST}/ from the godot-mp stack, so the
  # game and the lobby it talks to share one origin.
  # ============================================================================
  publish-web-image:
    name: 🐳 Publish web client image
    needs: build
    # Master pushes only — a PR must not build or push the image.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Job-level env, so the "is the webhook configured?" test below reads an
    # ordinary variable rather than the secrets context (same as lobby.yml).
    env:
      PORTAINER_HOOK: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
    steps:
      # Only web/ is needed — the Dockerfile copies the export, it does not build it.
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Lands beside the Dockerfile as the ./site directory it COPYs.
      - name: 📦 Download the web export
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/site

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest is deliberate here, unlike the lobby image. Portainer force-pulls
      # this stack, and pinning the SHA the way lobby.yml does would mean two
      # workflows force-pushing the `deploy` branch — they would clobber each
      # other's pins. The :<sha> tag exists purely to roll back by hand.
      - name: 🐳 Build and push image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/godot-test1-web:latest
            ghcr.io/${{ github.repository_owner }}/godot-test1-web:${{ github.sha }}

      # Skipped when the secret is absent, so the image still publishes without it.
      - name: 🪝 Trigger Portainer redeploy
        if: env.PORTAINER_HOOK != ''
        uses: distributhor/workflow-webhook@2381f0e9c7b6bf061fb1405bd0804b8706116369 # v3.0.8
        with:
          webhook_url: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
          webhook_secret: "trigger"

  # ============================================================================
  # Deploy to GitHub Pages (only from master branch)
  # ============================================================================
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Only deploy on push to master branch
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
