# Replaces nginx's stock default.conf. Everything here that is not a header is
# the stock server block; the two headers are the reason this file exists.
#
# A Godot 4 web export uses SharedArrayBuffer, and browsers only hand that out to
# a cross-origin-isolated page — which is exactly these two headers. Without them
# the game loads and then dies in the engine's startup, so they are load-bearing,
# not hardening. `always` so they are sent on error responses too.
#
# ponytail: no gzip_static/brotli_static — the export produces no .gz/.br
# variants, so the directives would only add config to look at. Add them (with
# the matching export setting) if the .wasm download time ever matters.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
}
