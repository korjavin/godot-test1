# THE FACE DETECTOR'S BILL OF MATERIALS (bead godot-test1-xtr.12).
#
# `scripts/fetch_vendor.sh` reads this file, downloads exactly what it names,
# and refuses to install anything whose sha256 does not match. It is the ONLY
# place a version or a url is written down: CI and the developer rig run that
# one script, so there is no second list to keep in step.
#
# WHY THESE FILES ARE NOT IN GIT: they are 11.76 MB of binaries, and a binary in
# history is permanent weight on every clone and every CI checkout forever. They
# are fetched at BUILD time and baked into the image instead. That is not a
# runtime CDN and does not weaken the owner's ruling of 2026-09-06 — the rule is
# about what the PLAYER'S BROWSER loads, which is still only ever our own nginx.
#
# Columns, whitespace-separated:
#   npm   <package@version>  <registry url of the tarball>
#   file  <path under here>  <sha256>  <member path inside the tarball>
#   model <path under here>  <sha256>  <absolute url>
#
# The TARBALL itself carries no sha here on purpose: the per-file hashes below
# are the control that matters, because they are checked against what actually
# lands on disk and therefore what actually ships. A tarball hash would be a
# second checksum to update on every re-pin, guarding a step whose output is
# already verified — and extraction names its members explicitly, so a hostile
# archive cannot write outside the directory either way.
#
# WHY 1.0.1, why only these files, and why the IIFE bundle rather than the ES
# module: see README.md next to this file. Re-pinning means new shas here and
# nothing else.

