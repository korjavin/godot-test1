# Replaces nginx's stock default.conf. This is the stock server block and
# nothing else — no headers, deliberately.
#
# ----------------------------------------------------------------------------
# THIS BUILD IS NOT CROSS-ORIGIN ISOLATED, AND MUST NOT BE
# ----------------------------------------------------------------------------
# This file used to send `Cross-Origin-Opener-Policy: same-origin` and
# `Cross-Origin-Embedder-Policy: require-corp`, on the assumption that a Godot 4
# web export needs SharedArrayBuffer and would "die in the engine's startup"
# without them. That assumption was never true here: `export_presets.cfg` has
# carried `variant/thread_support=false` since the first commit, so the export is
# single-threaded and touches no SharedArrayBuffer. (The engine's `index.js` only
# exposes `isSharedArrayBufferAvailable()` as an informational helper — nothing
# gates on it.)
#
# The headers were not merely useless, they were actively breaking a feature.
# Under `require-corp` the browser blocks EVERY cross-origin subresource that
# does not come back with `Cross-Origin-Resource-Policy` or CORS headers — and a
# plain `<video src=…>` is a no-CORS request. So the intro film and the Game Over
# clip, both served from the project's R2 bucket at img.cc.wandergeek.org, failed
# with `ERR_BLOCKED_BY_RESPONSE.NotSameOriginAfterDefaultedToSameOriginByCoep`.
# Silently, because `intro_video.gd` is fail-open by design: a blocked source is
# indistinguishable from a dead CDN, so the game just started with no film.
#
# **Do not re-add these headers to fix something else.** They are only correct
# once `variant/thread_support=true`, and turning that on means ALSO giving every
# cross-origin asset a `Cross-Origin-Resource-Policy: cross-origin` header at the
# CDN first — otherwise enabling threads silently kills the videos again.
#
# ponytail: no gzip_static/brotli_static — the export produces no .gz/.br
# variants, so the directives would only add config to look at. Add them (with
# the matching export setting) if the .wasm download time ever matters.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
}
