# Replaces nginx's stock default.conf. The stock server block plus exactly one
# header — `Cache-Control`. Read the two blocks below before adding a third.
#
# ----------------------------------------------------------------------------
# THIS BUILD IS NOT CROSS-ORIGIN ISOLATED, AND MUST NOT BE
# ----------------------------------------------------------------------------
# This file used to send `Cross-Origin-Opener-Policy: same-origin` and
# `Cross-Origin-Embedder-Policy: require-corp`, on the assumption that a Godot 4
# web export needs SharedArrayBuffer and would "die in the engine's startup"
# without them. That assumption was never true here: `export_presets.cfg` has
# carried `variant/thread_support=false` since the first commit, so the export is
# single-threaded and touches no SharedArrayBuffer. (The engine's `index.js` only
# exposes `isSharedArrayBufferAvailable()` as an informational helper — nothing
# gates on it.)
#
# The headers were not merely useless, they were actively breaking a feature.
# Under `require-corp` the browser blocks EVERY cross-origin subresource that
# does not come back with `Cross-Origin-Resource-Policy` or CORS headers — and a
# plain `<video src=…>` is a no-CORS request. So the intro film and the Game Over
# clip, both served from the project's R2 bucket at img.cc.wandergeek.org, failed
# with `ERR_BLOCKED_BY_RESPONSE.NotSameOriginAfterDefaultedToSameOriginByCoep`.
# Silently, because `intro_video.gd` is fail-open by design: a blocked source is
# indistinguishable from a dead CDN, so the game just started with no film.
#
# **Do not re-add these headers to fix something else.** They are only correct
# once `variant/thread_support=true`, and turning that on means ALSO giving every
# cross-origin asset a `Cross-Origin-Resource-Policy: cross-origin` header at the
# CDN first — otherwise enabling threads silently kills the videos again.
#
# ponytail: no gzip_static/brotli_static — the export produces no .gz/.br
# variants, so the directives would only add config to look at. Add them (with
# the matching export setting) if the .wasm download time ever matters. The
# `/vendor/` block below is ON-THE-FLY gzip and not that: it compresses files
# that are in git, so there is no second copy to keep in step.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------------
    # EVERY ASSET REVALIDATES, ALWAYS
    # ------------------------------------------------------------------------
    # `no-cache` does not mean "do not store" — it means "store it, but ask
    # before you reuse it". That is the only correct setting for this site: a
    # Godot export's filenames carry no content hash, so `index.js`,
    # `index.wasm` and `index.pck` keep the same url from build to build and a
    # cached copy is indistinguishable from a current one. Without an explicit
    # header nginx sends only ETag/Last-Modified, and browsers fall back to
    # HEURISTIC freshness — which is how a fresh shell ended up paired with a
    # stale 7 MB `.pck`. A mismatched build is worse than a plainly stale one.
    #
    # The cost is one conditional request per asset per load, and nginx answers
    # it from the ETag with a 304 and no body — so the 38 MB `.wasm` is still
    # only paid for when it actually changed.
    #
    # `always`, so the header is also on the 304 itself; without it nginx only
    # adds headers to a short list of status codes and the revalidation reply
    # would come back with no cache directive of its own.
    add_header Cache-Control "no-cache" always;

    # ------------------------------------------------------------------------
    # THE VENDORED FACE DETECTOR IS COMPRESSED ON THE WAY OUT
    # ------------------------------------------------------------------------
    # `web/vendor/mediapipe/`'s wasm is 9.57 MB on disk and 2.9 MB gzipped — the
    # difference between a download the owner ruled acceptable (~4 MB, bead
    # `godot-test1-xtr.12`) and one two and a half times over it. wasm is not in
    # nginx's default `gzip_types` and the stock config leaves `gzip` off
    # entirely, so both have to be said here.
    #
    # SCOPED TO THIS PREFIX ON PURPOSE. Turning gzip on for the whole root would
    # also re-encode the engine's own 38 MB `index.wasm` on every cold load,
    # which is a change to how the GAME is served made as a side effect of a
    # camera feature — measure that separately if it is ever wanted.
    #
    # Level 6 rather than the default 1: these files revalidate with a 304 and a
    # body is sent only when they actually change, i.e. when the pin in
    # `web/vendor/mediapipe/README.md` moves, so the CPU is paid once per player
    # per version and buys ~600 KB over level 1.
    # No `types` block is needed and that is worth one line, because it nearly
    # was: the vendored bundle is the library's `.js` IIFE, and nginx 1.31 maps
    # `js` and `wasm` but has NO row for `mjs` (verified in the pinned image).
    # Had the ES module been vendored instead it would have been served as
    # `application/octet-stream`, which a browser refuses to run as a module —
    # dropping every player to the centre crop, silently. `.tflite` falls to
    # `application/octet-stream`, which is correct: it is fetched as bytes.
    location /vendor/ {
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;
        gzip_types application/wasm application/javascript text/javascript application/octet-stream;
    }
}
