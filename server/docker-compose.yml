# Lobby + web client + TURN stack. Portainer watches the `deploy` branch and reads
# this file at server/docker-compose.yml; CI rewrites both LOBBY_IMAGE's and
# WEB_IMAGE's tag to the commit SHA there, in one commit from one job
# (build.yml's deploy-stack) — the branch is force-pushed, so it has one writer.
#
# Traefik terminates TLS and proxies the websocket, so clients reach the lobby at
# wss://${LOBBY_HOST}/ws. No special Traefik configuration is needed for the
# upgrade — it forwards Connection/Upgrade headers by default.
#
# One host, two containers: the game client owns `/` and the lobby keeps only its
# four endpoints. ADD EVERY NEW LOBBY ROUTE TO THAT RULE — the client's catch-all
# swallows anything the narrow rule does not name, so a route that works locally
# would 404 (or serve the game's index.html) in production.
# Traefik picks the most specific rule by priority (higher wins),
# so the lobby's narrow rule at 10 beats the client's catch-all at 1. Consequence
# worth knowing: the lobby's embedded test page at `/` is shadowed in production.

services:
  lobby:
    image: ${LOBBY_IMAGE:-ghcr.io/korjavin/godot-test1-lobby:latest}
    container_name: ${LOBBY_CONTAINER_NAME:-godot-lobby}
    restart: unless-stopped
    networks:
      - traefik_network
    environment:
      LOBBY_ADDR: ":8080"
      # Comma-separated origin patterns, or "*" for any page. The lobby holds no
      # credential, so "*" is a deliberate default rather than an oversight.
      LOBBY_ALLOWED_ORIGINS: ${LOBBY_ALLOWED_ORIGINS:-*}
      # Handed to clients verbatim by GET /ice, so TURN credentials never get
      # baked into the game build.
      STUN_URL: ${STUN_URL:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:-}
      TURN_USER: ${TURN_USER:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      # Set this and BOTH halves flip together: coturn below takes
      # --use-auth-secret, and /ice mints a time-limited credential per call
      # instead of handing out the static pair forever. Unset, both stay on the
      # static pair — see turnCredentials in main.go for why they cannot be
      # migrated one at a time.
      TURN_SECRET: ${TURN_SECRET:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK_NAME:-traefik_default}"
      - "traefik.http.routers.godot-lobby.rule=Host(`${LOBBY_HOST}`) && (Path(`/ws`) || Path(`/ice`) || Path(`/rooms`) || Path(`/healthz`))"
      - "traefik.http.routers.godot-lobby.priority=10"
      - "traefik.http.routers.godot-lobby.entrypoints=websecure"
      - "traefik.http.routers.godot-lobby.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}"
      - "traefik.http.services.godot-lobby.loadbalancer.server.port=8080"

  # The Godot web export behind nginx — the same build GitHub Pages serves.
  # Catch-all rule at priority 1: everything the lobby did not claim above.
  #
  # :latest here is a placeholder that only master ever sees. Exactly like
  # LOBBY_IMAGE, CI rewrites this tag to the commit SHA on the `deploy` branch —
  # both in the same commit, from the same job, so the two containers of a deploy
  # always come from one master commit. Never :latest in production.
  web:
    image: ${WEB_IMAGE:-ghcr.io/korjavin/godot-test1-web:latest}
    container_name: ${WEB_CONTAINER_NAME:-godot-web}
    restart: unless-stopped
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK_NAME:-traefik_default}"
      - "traefik.http.routers.godot-web.rule=Host(`${LOBBY_HOST}`)"
      - "traefik.http.routers.godot-web.priority=1"
      - "traefik.http.routers.godot-web.entrypoints=websecure"
      - "traefik.http.routers.godot-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}"
      - "traefik.http.services.godot-web.loadbalancer.server.port=80"

  # coturn runs on the host network on purpose: a TURN relay hands out ports from
  # a range (TURN_MIN_PORT..TURN_MAX_PORT), and publishing dozens of UDP ports
  # through the bridge is both slow to start and easy to get wrong. Traefik is not
  # involved — TURN is not HTTP.
  coturn:
    image: ${COTURN_IMAGE:-coturn/coturn:4.6-alpine}
    container_name: ${COTURN_CONTAINER_NAME:-godot-coturn}
    restart: unless-stopped
    network_mode: host
    # NOTE: `command:` below is a YAML LIST, not a `>` folded scalar. In a folded
    # scalar `#` does NOT start a comment — the prose that used to sit inline here
    # was folded into the command string and handed to coturn as arguments. Most
    # of it only produced "CONFIG: Unknown argument" lines, but the phrase naming
    # `--use-auth-secret` was a REAL long option: getopt_long permutes, coturn saw
    # it alongside --lt-cred-mech, logged that shared secret overrides
    # username/password auth, and then failed EVERY allocation because no
    # --static-auth-secret was configured. TURN was silently dead in production.
    # Keep the explanation out here, above the list.
    #
    # The denied-peer ranges: the relay runs with network_mode: host, so an
    # unblocked range is a PIVOT INTO THE DEPLOYMENT HOST, and /ice hands the
    # credentials to anyone who asks. RFC1918 alone left loopback (the lobby
    # itself, and anything else that trusts 127/8), cloud instance metadata on
    # 169.254/16, CGNAT, and EVERY IPv6 address relayable.
    #
    # The quotas: /ice is unauthenticated by necessity (the game build cannot hold
    # a secret) and CORS is browser-only, so the quotas are what bound a scraped
    # credential's blast radius while it is still valid.
    #
    # AUTH MODE, and why it is two conditional arguments rather than a rewrite:
    # with TURN_SECRET set, coturn takes TIME-LIMITED REST credentials, which
    # main.go mints per /ice call (username "<expiry>:ck", credential
    # base64(HMAC-SHA1(secret, username))) — so a scraped response stops relaying
    # at the expiry instead of never. `${VAR:+...}` expands to the flag only when
    # the variable is set, and to an empty argument otherwise, which coturn
    # ignores (measured against coturn 4.6.3) — so a deployment WITHOUT a secret
    # gets byte-identical arguments to the static setup this ran on before. The
    # `--user` line below stays either way and needs no condition: with the
    # secret configured coturn refuses it anyway ("check_stun_auth: Cannot find
    # credentials"), which is exactly why main.go must not mint REST credentials
    # until the operator has created the secret. Keep the secret alphanumeric —
    # the coturn image's entrypoint runs `eval` over each argument.
    command:
      - "-n"
      - "--log-file=stdout"
      - "--no-cli"
      - "--lt-cred-mech"
      - "${TURN_SECRET:+--use-auth-secret}"
      - "${TURN_SECRET:+--static-auth-secret=${TURN_SECRET}}"
      - "--fingerprint"
      - "--realm=${TURN_REALM}"
      - "--user=${TURN_USER}:${TURN_PASSWORD}"
      - "--listening-port=${TURN_LISTEN_PORT:-3478}"
      - "--min-port=${TURN_MIN_PORT:-49160}"
      - "--max-port=${TURN_MAX_PORT:-49200}"
      - "--external-ip=${TURN_EXTERNAL_IP}"
      - "--no-tls"
      - "--no-dtls"
      - "--no-multicast-peers"
      # NO --no-loopback-peers: coturn 4.6 REMOVED the option (loopback denial
      # became the default), and the unknown flag makes the binary exit 255
      # before logging anything — measured on this host: the container
      # crashlooped 500+ times with only the config-file warning printed, and
      # the same argv minus this one flag runs clean. Loopback stays blocked
      # twice over: the 4.6 default plus the explicit 127/8 range below.
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.0.0.0-192.0.0.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--denied-peer-ip=::1-::1"
      - "--denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
      - "--denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
      - "--user-quota=${TURN_USER_QUOTA:-12}"
      - "--total-quota=${TURN_TOTAL_QUOTA:-200}"

networks:
  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK_NAME:-traefik_default}
